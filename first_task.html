<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Computers &amp; Programs | Batool’s Code Studio</title>

<link rel="stylesheet" href="studio-mockups/studio.css"><link rel="stylesheet" href="studio-live.css"><link rel="stylesheet" href="mission-navigation.css">
</head>
<body>
<a class="skip" href="#main">Skip to lesson</a>
<nav class="mission-navigation" aria-label="Studio navigation"><a href="index.html#missions">Back to missions</a></nav>
<main class="stage" id="main">

  <p class="label">Mission 01 / 04</p><h1>Computers &amp; Programs</h1><div class="card challenge active" id="quizCard">
    <div class="meter-wrap"><div class="meter-fill" id="meterFill"></div></div>
    <div class="meta-row"><span id="qCounter">Question 1 / 16</span><span id="scoreLive">Score: 0</span></div>
    <h2 tabindex="-1" id="qText"></h2>
    <div id="optsWrap"></div>
    <div class="explain" id="explainBox" role="status"></div>
    <div class="nextrow"><button id="nextBtn" disabled>Next challenge</button></div>
  </div>

  <div class="card result" id="resultCard">
    <div class="rank" id="rankEmoji"></div>
    <h2 id="rankTitle">Circuit Master</h2>
    <div class="score-num" id="finalScore">14/16</div>
    <p id="rankMsg">Your foundations are rock solid.</p>
    <div class="best" id="bestLine"></div>
    <div style="margin-top:22px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap;">
      <button id="retryBtn" class="secondary">Retry Mission </button>
    </div>
  </div>

</main>
<script>
const QUESTIONS = [
  {q:"A computer follows instructions exactly as written, or figures out what you probably meant?",
   opts:["Exactly as written","Figures out what you meant"], correct:0,
   ex:"A computer has no common sense — it follows the instructions precisely, even if they're wrong."},
  {q:"What do we call the full written list of exact steps a computer follows?",
   opts:["A program","An input","A CPU"], correct:0,
   ex:"A program is the complete set of instructions the computer runs."},
  {q:"What is a single step inside a program called?",
   opts:["An output","An instruction","A storage unit"], correct:1,
   ex:"Each individual step in a program is one instruction."},
  {q:"'Execute' or 'run' a program means...",
   opts:["Deleting it","Writing it for the first time","Following its instructions, one at a time, in order"], correct:2,
   ex:"Executing a program means the computer carries out each instruction in sequence."},
  {q:"In Input → Process → Output, where do the ingredients you give the computer to start belong?",
   opts:["Input","Process","Output"], correct:0,
   ex:"Input is whatever you give the computer at the start."},
  {q:"'Process' in Input → Process → Output refers to...",
   opts:["The final result","What happens while the computer is working","The device's storage"], correct:1,
   ex:"Process is the work happening in between input and output."},
  {q:"If a recipe's final result is a cup of tea, that result is the...",
   opts:["Input","Process","Output"], correct:2,
   ex:"Output is what comes out at the end."},
  {q:"Which part of a computer actually carries out the instructions — the 'worker'?",
   opts:["Storage","CPU","Screen"], correct:1,
   ex:"The CPU (processor) is what actually performs each instruction."},
  {q:"Memory (RAM) is best compared to...",
   opts:["A filing cabinet that keeps files forever","A desk holding what you're using right now, cleared when powered off","A door to the internet"], correct:1,
   ex:"RAM holds what's actively being used, and clears when the device shuts down."},
  {q:"Which one keeps your photos and apps even after you turn the device off?",
   opts:["RAM","CPU","Storage"], correct:2,
   ex:"Storage (like a filing cabinet) keeps data permanently, unlike RAM."},
  {q:"A computer program runs its instructions...",
   opts:["In any order it prefers","One at a time, strictly in the written order","All at the exact same moment"], correct:1,
   ex:"This strict one-at-a-time, in-order behavior is called sequence."},
  {q:"If steps are in the wrong order, whose 'fault' is the broken result?",
   opts:["The computer's — it should've noticed","The instructions' — they were written wrong","Nobody's, it's random"], correct:1,
   ex:"The computer just follows the sequence given — if the order is wrong, the instructions are wrong."},
  {q:"What do we call a mistake in a program that causes a wrong or broken result?",
   opts:["A feature","A bug","An output"], correct:1,
   ex:"A bug is a mistake in the instructions, not a flaw in the computer itself."},
  {q:"What is 'debugging'?",
   opts:["Deleting the whole program and starting over","Finding and fixing a bug","Turning the computer off and on"], correct:1,
   ex:"Debugging is the normal skill of locating and fixing a bug."},
  {q:"Debugging usually means...",
   opts:["You're bad at coding","A completely normal, expected part of programming","Something only beginners do"], correct:1,
   ex:"Every programmer debugs constantly — it's a core, expected skill, not a sign of failure."},
  {q:"'Trace' a sequence means...",
   opts:["Erase it","Follow it step-by-step to check what actually happens","Guess the output without checking"], correct:1,
   ex:"Tracing means walking through each step in order to see exactly what the computer would do."}
];

let saved;
try { saved = JSON.parse(localStorage.getItem('cql_m1_checkpoint')); } catch {}
const usable = saved && Number.isInteger(saved.index) && saved.index >= 0 && saved.index < QUESTIONS.length && Number.isInteger(saved.points) && saved.points >= 0 && saved.points <= saved.index + Number(saved.solved === true);
let idx = usable ? saved.index : 0, score = usable ? saved.points : 0;
let tried = usable && saved.tried === true, solved = usable && saved.solved === true;
function checkpoint(){
  safeSet('cql_m1_checkpoint', JSON.stringify({index:idx,points:score,tried,solved}));
}

const quizCard = document.getElementById('quizCard');
const resultCard = document.getElementById('resultCard');
const qText = document.getElementById('qText');
const optsWrap = document.getElementById('optsWrap');
const explainBox = document.getElementById('explainBox');
const nextBtn = document.getElementById('nextBtn');
const meterFill = document.getElementById('meterFill');
const qCounter = document.getElementById('qCounter');
const scoreLive = document.getElementById('scoreLive');

function safeGet(key){ try{ return localStorage.getItem(key); }catch(e){ return null; } }
function safeSet(key,val){ try{ localStorage.setItem(key,val); }catch(e){} }



renderQuestion();
function renderQuestion(){
  const item = QUESTIONS[idx];
  qText.textContent = item.q;
  qCounter.textContent = `Question ${idx+1} / ${QUESTIONS.length}`;
  scoreLive.textContent = `Score: ${score}`;
  meterFill.style.width = `${(idx/QUESTIONS.length)*100}%`;
  explainBox.classList.remove('show');
  explainBox.textContent = '';
  nextBtn.disabled = !solved;
  nextBtn.hidden = !solved;
  nextBtn.textContent = idx === QUESTIONS.length-1 ? 'Finish mission' : 'Next challenge';
  if(solved) explainBox.textContent = item.ex;
  optsWrap.innerHTML = '';
  item.opts.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.disabled = solved;
    b.textContent = opt;
    b.addEventListener('click', ()=>selectAnswer(i));
    optsWrap.appendChild(b);
  });
}

function selectAnswer(choice){
  const item = QUESTIONS[idx];
  const buttons = optsWrap.querySelectorAll('.opt');
  if(choice !== item.correct){
    tried = true;
    checkpoint();
    explainBox.textContent = (idx === 0 ? 'Imagine a recipe with a step missing. Would the computer know what you meant?' : item.ex) + ' Try again.';
    return;
  }
  if(!tried) score++;
  solved = true;
  checkpoint();
  buttons.forEach(button => button.disabled = true);
  buttons[choice].classList.add('correct');
  nextBtn.hidden = false;
  nextBtn.disabled = false;
  nextBtn.focus();
  explainBox.textContent = item.ex;
  explainBox.classList.add('show');
  scoreLive.textContent = `Score: ${score}`;
  nextBtn.disabled = false;
}

nextBtn.addEventListener('click', ()=>{
  idx++;
  solved = tried = false;
  if(idx < QUESTIONS.length){
    checkpoint();
    qText.focus();
    renderQuestion();
  } else {
    meterFill.style.width = '100%';
    showResult();
  }
});

function showResult(){
  try { localStorage.removeItem('cql_m1_checkpoint'); } catch {}
  try { localStorage.setItem("cql_m1_finished", "1"); } catch {}
  quizCard.classList.remove('active');
  resultCard.classList.add('active');
  document.getElementById('finalScore').textContent = `${score}/${QUESTIONS.length}`;
  let emoji, title, msg;
  const pct = score / QUESTIONS.length;
  if(pct >= 0.9){ emoji=''; title='Lab Legend'; msg='You have mastered the basics.'; }
  else if(pct >= 0.7){ emoji='points '; title='Circuit Master'; msg='Your foundations are rock solid.'; }
  else if(pct >= 0.5){ emoji=''; title='Code Cadet'; msg="Good progress! A quick review of a few ideas and you're set."; }
  else { emoji=''; title='Rookie Inventor'; msg="Great first try — let's revisit a few ideas together next time."; }
  document.getElementById('rankEmoji').textContent = emoji;
  document.getElementById('rankTitle').textContent = title;
  document.getElementById('rankMsg').textContent = msg;

  const prevBest = parseInt(safeGet('cql_best_score') || '0', 10);
  const bestLine = document.getElementById('bestLine');
  if(score > prevBest){
    safeSet('cql_best_score', String(score));
    bestLine.textContent = prevBest > 0 ? `New personal best! (was ${prevBest}/${QUESTIONS.length})` : 'First mission logged as your best score!';
  } else {
    bestLine.textContent = `Personal best stays at ${prevBest}/${QUESTIONS.length}.`;
  }
}

document.getElementById('retryBtn').addEventListener('click', ()=>{
  idx = 0; score = 0; tried = solved = false; checkpoint();
  resultCard.classList.remove('active');
  quizCard.classList.add('active');
  renderQuestion();
});
</script>
</body>
</html>
